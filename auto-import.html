<!DOCTYPE html>
<html>
<head>
  <title>Auto Import</title>
</head>
<body>
  <h1>Importing orders.csv...</h1>
  <script>
    (async () => {
      try {
        // Wait for page to be ready
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        // Open the main app in the current window
        window.location.href = '/';
        
        // After navigation, inject the import logic
        window.addEventListener('load', async () => {
          await new Promise(resolve => setTimeout(resolve, 2000));
          
          const response = await fetch('/samples/orders.csv');
          const blob = await response.blob();
          const file = new File([blob], 'orders.csv', { type: 'text/csv' });
          const data = await window.LabelData.importFile(file);
          window.state.columns = data.columns;
          window.state.orders = data.rows;
          window.state.orderIndex = 0;
          window.refreshOrderUI();
          window.persistSession();
          alert(`已导入 ${data.rows.length} 条订单，${data.columns.length} 列。`);
        });
      } catch (err) {
        document.body.innerHTML += '<pre>' + err.toString() + '</pre>';
      }
    })();
  </script>
</body>
</html>
